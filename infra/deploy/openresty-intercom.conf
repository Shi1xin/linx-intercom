# intercom.lingxiwmp.qiniu.com — openresty conf.d 片段（待申请解析+证书后启用）
# 现有站点 lingxiwmp.qiniu.com 的 TLS/acme 由 1Panel 管理，子域沿用同一证书管理路径
server {
    listen 443 ssl;
    server_name intercom.lingxiwmp.qiniu.com;

    # ssl_certificate /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    # Janus WebSocket 信令（预留直连路径，客户端主要走 /ws）
    location /janus {
        proxy_pass http://127.0.0.1:8188;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 房间控制服务
    location /ws {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8090/healthz;
    }
}
