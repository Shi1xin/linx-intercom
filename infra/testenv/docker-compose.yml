# 灵矽同频测试环境（Omarchy）
# janus/coturn 使用 host 网络，UDP 媒体端口直接绑定主机接口
# 控制服务为独立 Go 进程，经 linx-run 管理，见 README

services:
  janus:
    image: canyan/janus-gateway:latest
    network_mode: host
    volumes:
      - ./janus:/usr/local/etc/janus:ro
    restart: unless-stopped
    command: ["/usr/local/bin/janus"]

  coturn:
    image: coturn/coturn:latest
    network_mode: host
    restart: unless-stopped
    command:
      - "-n"
      - "--log-file=stdout"
      - "--listening-port=3478"
      - "--realm=intercom"
      - "--user=intercom:night2026"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--external-ip=10.234.144.99"
      - "--no-tls"
      - "--no-dtls"
      - "--verbose"
    profiles: ["turn"]
