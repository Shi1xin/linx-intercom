# 灵矽同频测试环境
# janus/coturn 使用 host 网络，UDP 媒体端口直接绑定主机接口
# 控制服务为独立 Go 进程，启动方式见 infra/testenv/README.md

services:
  janus:
    image: canyan/janus-gateway:latest
    network_mode: host
    volumes:
      - ./janus:/usr/local/etc/janus:ro
    restart: unless-stopped
    command: ["/usr/local/bin/janus"]

  coturn:
    image: coturn/coturn:latest
    network_mode: host
    restart: unless-stopped
    command:
      - "-n"
      - "--log-file=stdout"
      - "--listening-port=3478"
      - "--realm=intercom"
      - "--user=${TURN_USER:-intercom}:${TURN_PASS:?set TURN_PASS}"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--external-ip=${PUBLIC_IP:?set PUBLIC_IP to the host LAN/public IP}"
      - "--no-tls"
      - "--no-dtls"
      - "--verbose"
    profiles: ["turn"]
